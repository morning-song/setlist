<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setlist — Claude Plugin Marketplace</title>
  <meta name="description" content="Discover and share Claude Code plugins, skills, MCP servers, and slash commands.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0f;
      --bg-card: #18181b;
      --bg-card-hover: #1e1e23;
      --bg-input: #111113;
      --border: #2a2a30;
      --border-focus: #5b5bd6;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --accent: #6e6ade;
      --accent-hover: #7c7be6;
      --accent-glow: rgba(110, 106, 222, 0.15);
      --tag-bg: #1e1e2e;
      --tag-text: #a5a5e0;
      --featured-border: #3f3f6e;
      --type-skill: #22c55e;
      --type-mcp: #3b82f6;
      --type-slash: #f59e0b;
      --type-hook: #ec4899;
      --type-plugin: #8b5cf6;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f8f8fc;
        --bg-card: #ffffff;
        --bg-card-hover: #f4f4f8;
        --bg-input: #f0f0f4;
        --border: #e2e2e8;
        --border-focus: #5b5bd6;
        --text: #1a1a2e;
        --text-muted: #6b6b80;
        --text-dim: #9898aa;
        --accent: #5b5bd6;
        --accent-hover: #4a4ac4;
        --accent-glow: rgba(91, 91, 214, 0.1);
        --tag-bg: #eeeeff;
        --tag-text: #5050c0;
        --featured-border: #c0c0e0;
        --type-skill: #16a34a;
        --type-mcp: #2563eb;
        --type-slash: #d97706;
        --type-hook: #db2777;
        --type-plugin: #7c3aed;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d0d0f;
      --bg-card: #18181b;
      --bg-card-hover: #1e1e23;
      --bg-input: #111113;
      --border: #2a2a30;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --accent: #6e6ade;
      --accent-hover: #7c7be6;
      --accent-glow: rgba(110, 106, 222, 0.15);
      --tag-bg: #1e1e2e;
      --tag-text: #a5a5e0;
      --featured-border: #3f3f6e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    /* Header */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      gap: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      text-decoration: none;
      flex-shrink: 0;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      text-decoration: none;
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }
    .btn-ghost:hover {
      background: var(--bg-card);
      color: var(--text);
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      text-decoration: none;
      color: #fff;
    }
    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 14px;
      display: flex;
      align-items: center;
    }
    .theme-toggle:hover { color: var(--text); }

    /* Hero */
    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 16px 40px;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
      line-height: 1.2;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 520px;
      margin: 0 auto 32px;
    }

    /* Search + Filter */
    .controls {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
      font-size: 15px;
    }
    input[type="search"] {
      width: 100%;
      padding: 11px 16px 11px 38px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="search"]:focus { border-color: var(--border-focus); }
    input[type="search"]::placeholder { color: var(--text-dim); }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label {
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 4px;
    }
    .filter-btn {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-btn.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Stats bar */
    .stats-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .stats-count {
      font-size: 13px;
      color: var(--text-muted);
    }
    .stats-count strong { color: var(--text); }

    /* Grid */
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px 64px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.15s;
      cursor: default;
    }
    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .card.featured {
      border-color: var(--featured-border);
    }
    .card.featured:hover { border-color: var(--accent); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .card-title-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .featured-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid var(--featured-border);
    }
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid currentColor;
      opacity: 0.9;
      flex-shrink: 0;
    }
    .type-badge.skill { color: var(--type-skill); background: rgba(34,197,94,0.08); }
    .type-badge.mcp-server { color: var(--type-mcp); background: rgba(59,130,246,0.08); }
    .type-badge.slash-command { color: var(--type-slash); background: rgba(245,158,11,0.08); }
    .type-badge.hook { color: var(--type-hook); background: rgba(236,72,153,0.08); }
    .type-badge.plugin { color: var(--type-plugin); background: rgba(139,92,246,0.08); }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-weight: 500;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .card-author {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
    }
    .card-action {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .card-action:hover {
      border-color: var(--accent);
      color: var(--accent);
      text-decoration: none;
    }
    .card-action.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .card-action.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #fff;
    }

    /* Install modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-title { font-size: 17px; font-weight: 600; }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .modal-close:hover { color: var(--text); background: var(--border); }
    .modal-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
    .install-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .install-block label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }
    .install-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      word-break: break-all;
      line-height: 1.6;
    }
    .copy-btn {
      align-self: flex-start;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .install-notes { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    /* Empty state */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty h3 { font-size: 16px; margin-bottom: 8px; color: var(--text-muted); }
    .empty p { font-size: 13px; }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 16px;
      text-align: center;
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    footer p { font-size: 12px; color: var(--text-dim); }
    footer a { color: var(--text-muted); }

    @media (max-width: 600px) {
      .header-actions .btn-ghost { display: none; }
      .hero { padding: 32px 16px 28px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href=".">
        <span class="logo-icon">🎵</span>
        setlist
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
        <a class="btn btn-ghost" href="https://github.com/morning-song/setlist/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">Submit a plugin</a>
        <a class="btn btn-primary" href="https://github.com/morning-song/setlist" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </div>
    </div>
  </header>

  <div class="hero">
    <h1>The <span>Claude Code</span> plugin marketplace</h1>
    <p>Discover skills, MCP servers, slash commands, and hooks that extend what Claude can do for your team.</p>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" placeholder="Search plugins…" autocomplete="off" spellcheck="false">
    </div>
    <div class="filter-row">
      <span class="filter-label">Type</span>
      <button class="filter-btn active" data-type="all">All</button>
      <button class="filter-btn" data-type="skill">Skills</button>
      <button class="filter-btn" data-type="mcp-server">MCP Servers</button>
      <button class="filter-btn" data-type="slash-command">Slash Commands</button>
      <button class="filter-btn" data-type="hook">Hooks</button>
      <button class="filter-btn" data-type="plugin">Plugins</button>
    </div>
  </div>

  <div class="stats-bar">
    <span class="stats-count" id="statsCount"></span>
  </div>

  <div class="grid" id="grid"></div>

  <!-- Install modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle"></div>
        </div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="install-block">
        <label>Install command</label>
        <code class="install-code" id="modalCmd"></code>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <p class="install-notes" id="modalNotes"></p>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <p>
        <a href="https://github.com/morning-song/setlist" target="_blank" rel="noopener">morning-song/setlist</a>
        · Open source · <a href="https://github.com/morning-song/setlist/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">Submit a plugin</a>
      </p>
      <p>Built for <a href="https://claude.ai/code" target="_blank" rel="noopener">Claude Code</a></p>
    </div>
  </footer>

  <script>
    const TYPE_ICONS = {
      skill: '🧠',
      'mcp-server': '🔌',
      'slash-command': '/',
      hook: '🪝',
      plugin: '🧩',
    };

    let allPlugins = [];
    let activeType = 'all';
    let searchQuery = '';

    async function loadRegistry() {
      try {
        const res = await fetch('./registry.json');
        const data = await res.json();
        allPlugins = data.plugins || [];
        render();
      } catch (e) {
        document.getElementById('grid').innerHTML =
          '<div class="empty"><h3>Could not load registry</h3><p>Check the console for details.</p></div>';
        console.error(e);
      }
    }

    function matches(p) {
      if (activeType !== 'all' && p.type !== activeType) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        return p.name.toLowerCase().includes(q) ||
          p.description.toLowerCase().includes(q) ||
          (p.tags || []).some(t => t.toLowerCase().includes(q)) ||
          p.author.name.toLowerCase().includes(q);
      }
      return true;
    }

    function render() {
      const visible = allPlugins.filter(matches);
      const grid = document.getElementById('grid');
      const count = document.getElementById('statsCount');

      count.innerHTML = `<strong>${visible.length}</strong> plugin${visible.length === 1 ? '' : 's'}${activeType !== 'all' ? ` · ${activeType}` : ''}${searchQuery ? ` matching "${searchQuery}"` : ''}`;

      if (visible.length === 0) {
        grid.innerHTML = '<div class="empty"><h3>No plugins found</h3><p>Try a different search or filter.</p></div>';
        return;
      }

      grid.innerHTML = visible.map(p => cardHTML(p)).join('');
      grid.querySelectorAll('[data-install]').forEach(btn => {
        btn.addEventListener('click', () => openModal(btn.dataset.install));
      });
    }

    function typeLabel(type) {
      return { skill: 'Skill', 'mcp-server': 'MCP Server', 'slash-command': 'Slash Command', hook: 'Hook', plugin: 'Plugin' }[type] || type;
    }

    function cardHTML(p) {
      const icon = TYPE_ICONS[p.type] || '📦';
      const hasInstall = p.install?.command;
      const installNotes = p.install?.notes || '';
      return `
        <div class="card${p.featured ? ' featured' : ''}">
          <div class="card-header">
            <div class="card-title-row">
              <div class="card-name">
                ${escHtml(p.name)}
                ${p.featured ? '<span class="featured-badge">Featured</span>' : ''}
              </div>
            </div>
            <span class="type-badge ${escHtml(p.type)}">${icon} ${typeLabel(p.type)}</span>
          </div>
          <p class="card-desc">${escHtml(p.description)}</p>
          ${p.tags?.length ? `<div class="card-tags">${p.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
          <div class="card-footer">
            <span class="card-author">by ${escHtml(p.author.name)}</span>
            <div class="card-actions">
              ${p.source ? `<a class="card-action" href="${escAttr(p.source)}" target="_blank" rel="noopener">Source ↗</a>` : ''}
              <button class="card-action primary" data-install="${escAttr(p.id)}">Install</button>
            </div>
          </div>
        </div>`;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
    }

    function openModal(id) {
      const p = allPlugins.find(x => x.id === id);
      if (!p) return;
      document.getElementById('modalTitle').textContent = p.name;
      document.getElementById('modalDesc').textContent = p.description;
      document.getElementById('modalCmd').textContent = p.install?.command || '— see notes below';
      document.getElementById('modalNotes').textContent = p.install?.notes || '';
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.add('hidden');
    });
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modalOverlay'))
        document.getElementById('modalOverlay').classList.add('hidden');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.getElementById('modalOverlay').classList.add('hidden');
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const cmd = document.getElementById('modalCmd').textContent;
      navigator.clipboard.writeText(cmd).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      render();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.type;
        render();
      });
    });

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    let darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
      themeToggle.textContent = darkMode ? '☀️' : '🌙';
    }
    themeToggle.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });

    loadRegistry();
  </script>
</body>
</html>
